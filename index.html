<style>
:root{--bg:#0b1512;--fg:#9fe29f;--dim:#5f8f6f;--acc:#e8c97a;--bad:#e08a8a;--line:#24503f;--panel:#0f1f19}

.panel{border:1px solid var(--line);border-top:none;padding:14px;min-height:340px;background:var(--bg)}
.card{border:1px solid var(--line);background:var(--panel);padding:12px;margin:10px 0}

textarea{min-height:70px;resize:vertical}

<script>
window.onerror=function(m,s,l){var b=document.getElementById('errbox');if(b){b.style.display='block';b.textContent='СБОЙ ТЕРМИНАЛА: '+m+' (строка '+l+')'}};
var DATA={"ITEMS": [{"id": 3, "title": "Показания сторожа Груздева", "place": "Проходная, настольная папка дежурного", "blocks": [{"t": "p", "v": "Обязан доложить следующее. Дежурство моё с четырёх дня. Сидел на проходной, радио слушал — «Маяк», выпуск новостей в пять. Позже начал сходить по этажам, как положено по инструкции."}, {"t": "p", "v": "Утром, ещё в первой половине дня, видел: Наталья Викторовна у двери кладовой реквизита записку прибивала — на клочке бумаги, канцелярскими кнопками. Прочитать не успел, но она пояснила: «Реквизит не трогать, всё расставлено по линейке»."}, {"t": "p", "v": "Без четверти восемь вышел по своим местам. Вижу — Наталья Викторовна через двор к воротам идёт. Авоська в руке, идёт торопливо, чуть не бежит. Я крикнул: «Куда ж вы, товарищ Морозова, дверь-то закрыть!» — а она не обернулась, ничего не сказала. За ворота вышла и пошла в сторону магазина «Кузнецк»."}, {"t": "p", "v": "Без пяти девять подошёл к буфету — а там у прилавка кто-то стоит. В белом халате, к лицу не повернулся, коробка под мышкой. Спросил: «Вы чего тут в такой час?» — а он(а) быстро от буфета — в коридор, к актовому залу. Я за ним(ей) шагнул — а к тому времени уж в темноте растворился(ась), не угнаться, ноги не те."}, {"t": "p", "v": "А уже когда обратно к проходной возвращался, слышал — дверь кладовой скрипнула. Дверь та всегда скрипит, кто её ни открой. Думал: опять молодёжь за реквизитом, завтра линейка. Так и не пошёл проверять — думал, своё дело знаю."}, {"t": "p", "v": "Больше обстоятельств не знаю. Показания даю добровольно, верно изложено, читал."}, {"t": "p", "v": "25 мая 1988 г.    М. И. Груздев"}]}, {"id": 15, "title": "Журнал выдачи ключей", "place": "Проходная, гвоздик у конторки сторожа", "blocks": [{"t": "p", "v": "ЖУРНАЛ ВЫДАЧИ КЛЮЧЕЙ. Средняя школа № 2. Ведёт: сторож М. И. Груздев."}, {"t": "table", "rows": [["Дата", "Ключ", "Кому выдан", "Выдан", "Возвращён", "Отметка"], ["21.05 (сб)", "каб. химии", "Ершов О. Б.", "8:05", "17:30", ""], ["22.05 (пн)", "буфет", "Смирнова К. И.", "8:00", "18:00", ""], ["22.05 (пн)", "акт. зал", "Морозова Н. В.", "15:00", "20:30", "репетиция"], ["23.05 (вт)", "акт. зал", "Морозова Н. В.", "14:40", "19:50", "репетиция"], ["23.05 (вт)", "каб. химии", "Ершов О. Б.", "8:10", "17:20", ""], ["24.05 (вт)", "буфет", "Смирнова К. И.", "8:00", "19:45", "после вызова в штаб"], ["24.05 (вт)", "акт. зал", "Морозова Н. В.", "15:30", "—", "НЕ ВОЗВРАЩЁН. Зал опечатан штабом"], ["24.05 (вт)", "каб. химии", "Ершов О. Б.", "8:05", "18:50", ""]]}, {"t": "p", "v": "Пометка сторожа под таблицей: «Ключ от актового зала товарищ Морозова за собой не вернула. Дверь зала после неё не заперта была — я сам запер и опечатал»."}]}, {"id": 2, "title": "Показания буфетчицы Смирновой", "place": "Буфет, папка вешалки", "blocks": [{"t": "p", "v": "Обстоятельства по существу следующие."}, {"t": "p", "v": "Двадцать четвёртого мая я работала с половины двенадцати, как обычно по учебным дням. Обед — с двенадцати сорока, между сменами — булки и компот, вечером — чай, кофе по 7 копеек."}, {"t": "p", "v": "Без четверти семь, может без двадцати — заходила Наталья Викторовна, организатор. Взволнованная была, торопилась. Кофе с собой попросила — я налила в стакан, она под мышку. Сказала: «Клавдия Ивановна, если кто за коробкой из кладовой придёт — не отдавайте никому, я сама распоряжаюсь, скоро вернусь». И ушла."}, {"t": "p", "v": "После шести в буфете стало пусто, я пошла посуду мыть. Около семи — точно не скажу, у нас с часами так: либо стенка врёт, либо я — кто-то в буфет зашёл. На пороге остановился. В белом халате, воротник поднят, лица не разглядела. Просил кофе. Я налила. Под мышкой коробка держалась — деревянная, невысокая, я такие от реквизита помню, они при переноске скрипят. Сам худой, рост невысокий, метр семьдесят, не выше. То ли женщина, то ли худой парень — не разобрать, ворота — и в сторону зала ушёл. Мелочь на прилавок оставил, ни слова не сказал."}, {"t": "p", "v": "Потом пришла Тамара Фёдоровна, уборщица, мыть полы. Больше в буфете за вечер никого не было. В девять ноль-ноль пришла Марина Львовна, сообщила про колокольчик — тут всё и открылось."}, {"t": "p", "v": "Показания даю добровольно, верно изложено, читала."}, {"t": "p", "v": "25 мая 1988 г.    Клавдия Ивановна Смирнова"}]}, {"id": 29, "title": "Фото «Буфет, 18:35»", "place": "Буфет, под прилавком", "blocks": [{"t": "p", "v": "Полароид. В кадре — у прилавка буфета Наталья Викторовна Морозова: стакан кофе в руке, лицо встревоженное, поворот к двери. На стене буфета — настенные часы, стрелки показывают 18:40."}, {"t": "p", "v": "На обороте надпись простым карандашом: «18:35. Товарищ Морозова кофе брала, торопилась куда-то. Попросила меня снять — сказала, для отчёта о подготовке линейки. К. И.»"}, {"t": "p", "v": "Пометка штаба: снять «для отчёта» — значит, сама захотела зафиксировать, что в это время была в буфете. Стеночные часы, судя по всему, идут неверно — сверить с другими помещениями."}]}, {"id": 1, "title": "Тетрадь буфета", "place": "Буфет, прилавок", "blocks": [{"t": "p", "v": "Тетрадь учёта буфета. Записи карандашом и шариковой ручкой. Несколько последних страниц:"}, {"t": "table", "rows": [["Дата", "Время", "Кто / класс", "Продано", "Кол-во", "Сумма", "Примечание"], ["18.05 (ср)", "15:05", "9-А", "компот, пирожок", "6 / 6", "48 коп.", ""], ["18.05 (ср)", "15:40", "10-Б", "чай, булочка", "4 / 2", "10 коп.", ""], ["19.05 (чт)", "12:40", "11-Б", "обед комплекс", "14", "1 р. 40 к.", ""], ["20.05 (пт)", "12:45", "учительская", "кофе, сушки", "12 / 15", "1 р. 46 к.", ""], ["21.05 (сб)", "12:30", "9-Б", "чай", "10", "10 коп.", ""], ["23.05 (пн)", "12:40", "7-А", "обед комплекс", "16", "1 р. 60 к.", ""], ["23.05 (пн)", "15:10", "10-А", "пирожок", "3", "18 коп.", ""], ["24.05 (вт)", "12:45", "10-Б", "обед комплекс, чай", "11 / 8", "1 р. 71 к.", ""], ["24.05 (вт)", "18:35", "Морозова Н. В.", "кофе с собой", "1", "7 коп.", "торопилась; про коробку говорила"]]}, {"t": "p", "v": "На отдельной странице «Распоряжения», почерком буфетчицы:"}, {"t": "p", "v": "«Наталья Викторовна сказала: коробку из кладовой реквизита никому не отдавать, она сама распоряжается. Записала тут же, пусть будет». Ниже, тем же вечером: «Около семи был кто-то в белом халате — кофе 1. Кассу не закрыла, запамятовала. Худой»."}]}, {"id": 33, "title": "Записка завуча организатору", "place": "Кабинет директора, корреспонденция за 24.05", "blocks": [{"t": "p", "v": "«Наталья Викторовна!"}, {"t": "p", "v": "Регламент линейки утверждён, правок больше не будет — вопрос закрыт, не обсуждаем."}, {"t": "p", "v": "Напоминаю о порядке: реквизит в кладовой, колокольчик после контрольного опыта и порядок в актовом зале до конца линейки — лично на вас. Всё должно быть учтено, проверено и доложено мне до девяти утра."}, {"t": "p", "v": "Если что-то выйдет из строя — отвечать будете по всей строгости, у меня не принято прощать неучтённое в праздник юбилейный."}, {"t": "p", "v": "И. С. Орлова»"}, {"t": "p", "v": "Пометка штаба: записка датирована утром 24.05. Организатор в этот день дважды получала напоминания о личной ответственности за реликвию и кладовую."}]}, {"id": 27, "title": "Записка директора организатору", "place": "Кабинет директора, ящик стола", "blocks": [{"t": "p", "v": "«Наталья Викторовна."}, {"t": "p", "v": "Напоминаю ещё раз, чтобы без недоразумений: после повторного опыта колокольчик немедленно доставить мне лично в кабинет. Никому не передавать, в чужие руки не давать, срок — до девятнадцати часов."}, {"t": "p", "v": "Реликвия мне дорога — полвека с ней, на юбилее она должна прозвучать. Подводить не дам никому, даже высоким товарищам с регламентом."}, {"t": "p", "v": "А. С. Ковалёв»"}, {"t": "p", "v": "Пометка штаба: директор знал окно возврата колокольчика — до 19:00. Исчезновение произошло ровно в это окно. Кому колокольчик «немедленно доставить» — подразумевается организатор: она отвечает за порядок после опыта."}]}, {"id": 26, "title": "График подготовки линейки", "place": "Кабинет директора, планшет на стене", "blocks": [{"t": "p", "v": "«ГРАФИК ПОДГОТОВКИ ПРАЗДНИЧНОЙ ЛИНЕЙКИ \"Последний колокольчик — 1988\" на 24 мая. Составлен: Морозова Н. В.»"}, {"t": "table", "rows": [["Время", "Что", "Кто отвечает"], ["11:00–11:40", "Утренний замер колокольчика у физика (кабинет физики)", "П. С., Н. В. М."], ["14:00", "Передача колокольчика химикам — под расписку", "директор, О. Б. Е."], ["15:30–17:00", "Расстановка реквизита в актовом зале", "Н. В. М."], ["18:30–18:40", "Повторный опыт, упаковка колокольчика в коробку", "О. Б. Е., староста"], ["до 19:00", "Колокольчик — лично к директору", "Н. В. М."], ["19:30–21:00", "Генеральный прогон линейки", "все ответственные"]]}, {"t": "p", "v": "Внизу листа, подчёркнуто: «Распределение и контроль — лично я. Н. В. М.»"}, {"t": "p", "v": "Пометка штаба: график единственный — и ведёт его организатор. Окно «до 19:00» в её же графе."}]}, {"id": 5, "title": "Обрывок диалога", "place": "Буфет, мусорная корзина", "blocks": [{"t": "p", "v": "Клочок бумаги, два почерка, записано на скорость:"}, {"t": "p", "v": "Первый почерк: «— Кладовую не трогать, сказала Наталья Викторовна. — А если понадобится реквизит? — До линейки — никак. Сама велела, я передать не могу»."}, {"t": "p", "v": "Второй почерк, с нажимом: «— Странная. Теперь она у нас и за колокольчик отвечает, и за кладовую? — Тише, услышит»."}]}, {"id": 4, "title": "Показания уборщицы Лебедевой", "place": "Подсобка уборщицы, табурет", "blocks": [{"t": "p", "v": "Обстоятельства по существу следующие."}, {"t": "p", "v": "После уроков я убирала классы, к шести часам дошла до коридора у актового зала. Там мыла полы — помню хорошо, потому что в зале репетировали, голоса слышны были сквозь двери."}, {"t": "p", "v": "Около семи часов, может чуть после, из-за угла к кладовой прошёл человек в белом халате. Шёл спиной ко мне, я лица не видела. Под мышкой нёс коробку деревянную — она при ходьбе поскрипывала, слышно было. Рост — метр семьдесят, не выше, я по косякам дверей мерить умею, вон косяк — метр восемьдесят почти. Стройный, то ли женщина, то ли худой парень — не разобрать."}, {"t": "p", "v": "Кричать не стала — мало ли, может, реквизит переносят, завтра линейка, кто-то из техничек переносит. Коробку такую помню: раньше в ней задачники лежали, от физика она, старая. Искали её не раз — а она всё у кладовой стояла."}, {"t": "p", "v": "К половине восьмого я полы домыла и ушла в свою подсобку. Больше никого в коридоре не встречала. В кладовую сама не заходила — там прибрано было с утра, больше не убирала."}, {"t": "p", "v": "Показания даю добровольно, верно изложено, читала."}, {"t": "p", "v": "25 мая 1988 г.    Тамара Фёдоровна Лебедева"}, {"t": "p", "v": "Пометка штаба: «то ли женщина, то ли худой парень» — обе свидетели (буфетчица и уборщица) не могут определить пол фигуры. Возвратившаяся из магазина организатор — под это описание подпадает."}]}, {"id": 6, "title": "Лабораторный журнал Ершова", "place": "Кабинет химии, кафедра лаборатории", "blocks": [{"t": "p", "v": "ЖУРНАЛ УЧЁТА ЛАБОРАТОРНЫХ РАБОТ И ОПЫТОВ. Кабинет химии, средняя школа № 2. 24.05.1988:"}, {"t": "p", "v": "14:00 — Принят бронзовый колокольчик (дар выпускников 1968 г.) по расписке №27 от директора Ковалёва А. С. Цель: контрольный анализ поверхности на наличие следов окисления и посторонних частиц. Примечание: поверхность визуально чистая, патина равномерная, без сколов."}, {"t": "p", "v": "15:30–16:45 — Проведён опыт №12 (реактив Толленса) на микропробах с нижней кромки. Результат: следов органики не обнаружено. Расход: 12 мл реактива, 3 предметных стекла."}, {"t": "p", "v": "17:10 — Повторный осмотр (по кабинетным часам). На внутренней стороне обода — едва заметная царапина (длина ~1,5 см). Зафиксировано фото №3 (плёнка в сейфе). Гипотеза: механическое повреждение при переноске, не связано с окислением."}, {"t": "p", "v": "18:30 — Завершён повторный опыт (спектральный анализ переносным прибором). Результат: состав патины соответствует норме, посторонних примесей нет. Вывод: колокольчик не подвергался внешнему химическому воздействию."}, {"t": "p", "v": "18:40 — Колокольчик упакован в оригинальную коробку (деревянная, без маркировки). Коробка взята из кладовой реквизита (ключ №16, висел на кольце у двери). Важно: коробка была пыльной, но сухой. На дне — тонкий слой пыли без свежих следов."}, {"t": "p", "v": "19:00 — Планировался возврат колокольчика директору лично. Не осуществлён: в коридоре у актового зала встретил завуча И. С. Орлову, она попросила срочно помочь с переносом реквизита для линейки. Ушёл в зал, вернулся через 15 минут — колокольчика на столе не оказалось. Обстоятельства исчезновения выясняются. Докладная будет подана."}, {"t": "p", "v": "О. Б. Ершов"}]}, {"id": 28, "title": "Фото царапины (фото №3)", "place": "Кабинет химии, сейф", "blocks": [{"t": "p", "v": "Фотоснимок (из сейфа кабинета химии, конверт с надписью «фото №3»). Увеличенный снимок внутренней стороны обода колокольчика: тонкая царапина длиной около полутора сантиметров, наискось, края свежие, без окисления — царапина недавняя."}, {"t": "p", "v": "На обороте почерком Ершова: «24.05, 17:10 (по кабин. часам). Царапина на ободе. Причина неясна. Плёнку — в сейф, до протокола». Пометка штаба: фотоснимок не показан директору и не внесён в формуляр колокольчика — химик зафиксировал повреждение и никому о нём не доложил."}, {"t": "p", "v": "Пометка штаба (продолжение): царапина — примета подлинника. Подмены колокольчика не было: украден настоящий."}]}, {"id": 8, "title": "Пробирка «ПРОБА № 2»", "place": "Кабинет химии, штатив лаборатории", "blocks": [{"t": "p", "v": "Штатив: пробирка с этикеткой «ПРОБА № 2». Объект: колокол школьный, бронза (дар выпускников 1968 г.). Отобрано с внутренней стороны обода. Дата отбора: 24.05.1988. Отбор произвёл: Ершов О. Б. Кабинет химии, школа № 2."}, {"t": "p", "v": "Ниже мелким шрифтом, от руки карандашом: «порошок просушен, хранить до протокола»."}, {"t": "p", "v": "Пометка штаба: химик брал пробу законно — по договорённости с директором. Но проба с обода означает: колокольчик он держал в руках и накануне пропажи."}]}, {"id": 30, "title": "Фото «Кабинет химии, 18:35»", "place": "Кабинет химии, кафедра лаборатории", "blocks": [{"t": "p", "v": "Полароид на кафедре лаборатории. В кадре: у прибора — Олег Борисович Ершов; рядом, у окна, — Таня Крылова (староста 11-А); и третьи — худой парень в белом халате, лицом в сторону прибора, лицо в полупрофиль, не разглядеть."}, {"t": "p", "v": "Подпись на обороте (почерк Ершова): «18:35. Повторный опыт. Ершов, Таня Крылова и худой парень в халате №2 — напросился помочь. Халат выдан со слов Тани. Кто это — не знаю, Таня не пояснила»."}, {"t": "p", "v": "Пометка штаба: помощник на опыт был получен самовольно, без приказа. Распоряжения о помощнике нет ни в графике (№26), ни в служебной записке организатора (№10)."}]}, {"id": 14, "title": "Журнал выдачи халатов", "place": "Кабинет химии, угол лаборатории", "blocks": [{"t": "p", "v": "ЖУРНАЛ ВЫДАЧИ ХАЛАТОВ. Кабинет химии, средняя школа № 2. 24.05.1988:"}, {"t": "table", "rows": [["Халат", "Кому выдан", "Время", "Примечание"], ["№ 1", "Ершов О. Б.", "8:00", "с утра, на весь день"], ["№ 2", "помощнику старосты 11-А (со слов Т. Крыловой)", "18:30", "выдан перед повторным опытом"], ["№ 3", "—", "—", "не выдавался"]]}, {"t": "p", "v": "Внизу страницы, почерком Ершова: «Личные вещи в карманах не проверялись. Халат №2 после опыта остался на вешалке — кто носил, не знаю»."}, {"t": "p", "v": "Пометка штаба: халат выдан «со слов Тани» — без имени, без расписки. Странное доверие. Группа вправе трактовать: сговор."}]}, {"id": 7, "title": "Халат №2 с уликами в кармане", "place": "Кабинет химии, вешалка лаборатории", "blocks": [{"t": "p", "v": "Белый халат №2, висит на вешалке у штативов. В правом кармане — листок в клетку, вырванный из тетради, карандашом, крупным почерком:"}, {"t": "p", "v": "«От имени выпускников 11-А спасибо школе за всё: за знания, за дружбу, за моменты, когда мы ошибались и учились. Мы обещаем не забудем этот колокольчик — он будет звучать в наших сердцах!»"}, {"t": "p", "v": "В левом кармане — конфетная бумажка «Ну, покедова». Строчка на листке совпадает со словом в слово с вырезанной репликой линейки (сверить со сценарием №9)."}, {"t": "p", "v": "Пометка штаба: имени автора на листке нет. Кто-то носил этот халат с выписанной репликой в кармане — человек, причастный к сценарию, находился в лаборатории в день пропажи."}]}, {"id": 32, "title": "Чек «Гастроном „Кузнецк“»", "place": "Учительская, стол организатора", "blocks": [{"t": "p", "v": "КАССА № 2 — ГАСТРОНОМ, г. Кузнецк. ЧЕК № 0417. Наименование: Спирт этиловый. Кол-во: 1. Сумма: 3-20. ИТОГО: 3-20. Дата и время: 24.05.88, 19:12."}, {"t": "p", "v": "На обороте помета Морозовой: «Олегу Борисовичу — на контрольный опыт. Н. В.»"}, {"t": "p", "v": "Пометка штаба: в 19:12 организатор физически находилась в гастрономе — в момент пропажи колокольчика она не была в школе."}]}, {"id": 10, "title": "Служебная записка организатора", "place": "Учительская, стол организатора", "blocks": [{"t": "p", "v": "Директору средней школы № 2 Ковалёву А. С. СЛУЖЕБНАЯ ЗАПИСКА:"}, {"t": "p", "v": "«Утром сего дня мною утверждена финальная редакция сценария линейки (копия прилагается)."}, {"t": "p", "v": "Для контрольного опыта (18:30, кабинет химии) требуется спирт этиловый. С начала мая в лаборатории спирт на исходе, заявку на завскладом ранее не подавала — по неопытности. Поэтому вынуждена отлучиться в магазин «Кузнецк» (ул. Красной Дианы) и купить спирт за личный счёт. Чек представлю."}, {"t": "p", "v": "Отлучка с 18:45 до 19:30. После возвращения спирт передам Ершову О. Б. под расписку."}, {"t": "p", "v": "Обращаю внимание: колокольчик после упаковки (18:40) остаётся в лаборатории до возврата директору. Отнести колокольчик директору после опыта вызвался помощник Тани Крыловой. Кто этот помощник — знает Таня Крылова; сама я его воочию не видела: халат выдан до моего прихода в кабинет."}, {"t": "p", "v": "24 мая 1988 г.    Н. В. Морозова»"}]}, {"id": 9, "title": "Сценарий линейки (финальная редакция)", "place": "Учительская, стол завуча", "blocks": [{"t": "p", "v": "«СЦЕНАРИЙ ПРАЗДНИЧНОЙ ЛИНЕЙКИ \"Последний колокольчик — 1988\". Автор: Н. В. Морозова. Дата: 23.05.1988 (финальная редакция)»."}, {"t": "p", "v": "ДЕЙСТВИЕ 1. ОТКРЫТИЕ — торжественная музыка, ведущие: Таня Крылова (11-А) и Игорь Семёнов (10-Б). Слово директору — А. С. Ковалёв."}, {"t": "p", "v": "ДЕЙСТВИЕ 2. ПАМЯТЬ И ТРАДИЦИИ — на сцену выходит 11-А, коллективное чтение стихотворения. Далее — символическая передача традиций. Выход старосты 11-А Тани Крыловой и ученика 11-А."}, {"t": "p", "v": "Реплика выпускника 11-А (ранее — по тексту): «От имени выпускников 11-А я хочу сказать спасибо школе за всё: за знания, за дружбу, за те моменты, когда мы ошибались и учились на ошибках. Мы обещаем, что не забудем этот колокольчик — он будет звучать в наших сердцах каждый раз, когда мы будем вспоминать школьные годы!» — вычеркнута одной чертой."}, {"t": "p", "v": "Пометка на полях (карандаш): «Реплику ученика 11-А вычеркнуть. Реплика слишком длинная, линейка затянется. Пусть говорит только староста»."}, {"t": "p", "v": "Новая версия (Таня Крылова): «От имени выпускников 11-А мы благодарим учителей и школу за все эти годы. Спасибо за терпение, за мудрость и за то, что верили в нас даже тогда, когда мы сами в себя не верили»."}, {"t": "p", "v": "ДЕЙСТВИЕ 3. СИМВОЛИЧЕСКИЙ КОЛОКОЛЬЧИК — выход первоклассников и выпускников. Право дать последний колокольчик — ученику 11-А (фамилия уточняется). Финал: общий вальс, возложение цветов к мемориальной доске."}]}, {"id": 11, "title": "Резолюция завуча", "place": "Учительская, поля сценария №9", "blocks": [{"t": "p", "v": "На полях сценария №9, поверх пометы об вычёркивании, синим карандашом, размашисто:"}, {"t": "p", "v": "«Регламент. Убрать. И. С.»"}, {"t": "p", "v": "Пометка штаба: инициатор вычёркивания реплики — завуч Орлова, а не организатор. Но организатор сценарий утверждала и раздавала: «мною утверждена финальная редакция» (№10)."}]}, {"id": 12, "title": "Показания классного руководителя Соколовой", "place": "Учительская, папка классного руководителя 11-А", "blocks": [{"t": "p", "v": "Обстоятельства по существу следующие."}, {"t": "p", "v": "К празднику готовилась реплика от выпускников — три недели, каждую строку. Готовил её один из выпускников 11-А (штаб знает, о ком речь; имя разглашать не берусь — вопрос личного характера). Я сидела с ним на репетициях: он поначалу картавил на «р», потом справился, читал чисто. Говорил мне: «Марина Львовна, это ведь не речь, это — обещание». Такое вот отношение."}, {"t": "p", "v": "Утром 24-го в финальном сценарии реплика оказалась вычеркнута и заменена словами старосты. Кто вычеркнул — не знаю: инициатором изменений была Ирина Сергеевна Орлова, я в правки не вмешивалась. Обращалась к Ирине Сергеевне с просьбой вернуть реплику — хотя бы сократить, но оставить обращение к учителям. Она ответила: регламент есть регламент."}, {"t": "p", "v": "Утром ученик узнал окончательно — на уроке литературы сорвался, о чём я доложила директору (докладная прилагается)."}, {"t": "p", "v": "Сегодня, около шестого часа, я видела у кабинета химии худого парня — метр семьдесят. Стоял у двери, будто ждал кого-то. Когда я поздоровалась, он ушёл быстро."}, {"t": "p", "v": "Показания даю добровольно, верно изложено, читала."}, {"t": "p", "v": "25 мая 1988 г.    М. Л. Соколова"}]}, {"id": 13, "title": "Личное дело Дёмина", "place": "Архив, папка «Личные дела 11-А»", "blocks": [{"t": "p", "v": "ЛИЧНОЕ ДЕЛО УЧАЩЕГОСЯ. Средняя школа № 2, г. Кузнецк."}, {"t": "p", "v": "Фамилия, имя: Дёмин Георгий Андреевич. Дата рождения: 14.03.1971 (17 лет). Класс: 11 «А». Классный руководитель: Соколова М. Л. Домашний адрес: ул. Свердлова, д. 28, кв. 7. Мать: Дёмина Анна Петровна, швеймебель. Отец: Дёмин Андрей Кузьмич, слесарь АТУ-3."}, {"t": "p", "v": "Успеваемость: 4 и 5. По русскому языку и литературе — «4»."}, {"t": "p", "v": "Общественная нагрузка: физорг класса. Участник художественной самодеятельности (сценки на вечерах), КВН школьной команды."}, {"t": "p", "v": "Отметки о поведении: «Активен, инициативен. На классном часе громко не согласился с мнением пионервожатой — было нарушением такта» (10 класс); «Возглавил спор о порядке проведения вечера. Проявил настойчивость» (ноябрь 1987); «На уроках работает неровно: интересуется тем, что увлекает, остальное игнорирует» (февраль 1988)."}, {"t": "p", "v": "Характеристика за 11 класс: Дёмин Г. А. — ученик способный, но легкомысленный. Любит быть на виду, громкий, самоуверенный. Требует постоянного контроля. Отношения с товарищами ровные, в классе популярен. За 11 класс — 1 дисциплинарное взыскание (замечание приказом №58 от 24.05.88 за срыв урока литературы). Халатно относится к поручениям, но в общественной работе энергичен."}, {"t": "p", "v": "Соколова М. Л."}, {"t": "p", "v": "Пометка штаба: рост 182 см (карточка досье). Фигура у кладовой — «метр семьдесят». Дёмин отпадает, остаётся вопрос: кто нёс коробку?"}]}, {"id": 17, "title": "Брошюра «Школьный колокольчик», 1968", "place": "Библиотека, полка «Краеведение»", "blocks": [{"t": "p", "v": "«ИСТОРИЯ НАШЕЙ ШКОЛЫ. Брошюра-приложение к материалам школьного музея. КУЗНЕЦК · 1968. ИНВ. № 1142»."}, {"t": "p", "v": "ШКОЛЬНЫЙ КОЛОКОЛЬЧИК: КАК ОН ПОЯВИЛСЯ. В 1938 году учащиеся старших классов решили подарить родной школе колокольчик. Средства собирали всем классом: макулатура, металлолом, полтинники в копилку. К осени 1938 года в артели «Металлист» был отлит бронзовый колокол весом в четыре килограмма. Поверхность покрылась тёмной патиной — благородной плёнкой окисления, которая образуется на меди со временем и защищает металл."}, {"t": "p", "v": "КОЛОКОЛЬЧИК И ШКОЛА: НЕРАЗЛУЧНЫЕ ДРУЗЬЯ. В 1965 году началось строительство нового крыла. Старое здание закрывалось на ремонт, ценности школы переносили во временное помещение. Где хранить реликвию? Решили: в сундуке с реквизитом актового зала. Сундук старый, крепкий, колокольчик в нём не пострадал. Так делали и в других школах: сундук считался самым надёжным местом. В 1968 году выпускники сделали колокольчику «серебряный юбилей» — подарили ему новое место хранения: шкаф в кабинете директора. С тех пор колокольчик живёт в шкафу директора. Но сундук в кладовой реквизита не выбросили: по традиции он хранится там «на память»."}, {"t": "p", "v": "Под строкой про сундук — карандашное подчёркивание и звёздочка на полях. Ниже, чужой рукой, пером: «В трудные времена реликвии возвращают туда, где они начинались»."}, {"t": "p", "v": "КАК ЗВУЧИТ БРОНЗА. Наш колокол имеет основной тон примерно 660 герц — нота ре-диез первой октавы. Опытный физик с камертоном и осциллографом легко определит подлинник: подлинный бронзовый колокольчик всегда «поёт» одну и ту же ноту."}]}, {"id": 18, "title": "Формуляр брошюры", "place": "Библиотека, картотека у кафедры выдачи", "blocks": [{"t": "p", "v": "Картонный формуляр брошюры ИНВ. № 1142:"}, {"t": "table", "rows": [["Дата", "Кому выдано", "Отметка о возврате"], ["18.05", "П. С. (физика)", "вернул 19.05"], ["21.05", "П. С. (физика)", "вернул 22.05"], ["23.05", "выдача в читальном зале (учащийся)", "в зале, до закрытия"]]}, {"t": "p", "v": "Пометка штаба: физик брал брошюру дважды до праздника. Третья выдача — накануне пропажи, читателю без имени."}]}, {"id": 31, "title": "Фото «Библиотека»", "place": "Библиотека, кафедра выдачи", "blocks": [{"t": "p", "v": "Полароид на кафедре выдачи. В кадре — дальний стол читального зала: Пётр Сергеевич склонился над брошюрой 1968 года, рядом раскрытый блокнот, карандаш в руке. На обороте почерком Никитиной: «Пётр Сергеевич за работой над стендом по звуку. З. П.»"}, {"t": "p", "v": "Под фотографией на кафедре лежат сама брошюра (№17) и её формуляр (№18)."}]}, {"id": 19, "title": "Показания библиотекаря Никитиной", "place": "Библиотека, стол библиотекаря", "blocks": [{"t": "p", "v": "Обстоятельства по существу следующие."}, {"t": "p", "v": "Двадцать первого числа ко мне приходил Пётр Сергеевич, физик — готовил стенд по звуку к линейке, просил брошюру про наш колокольчик, 1968 года издания. Выдала, вернул на следующий день. При второй выдаче, в понедельник 23-го, читал в зале. Вдруг нашёл частоту и воскликнул — слышали все, кто был в зале: «Вот она, шестьдесят шесть ноль! И сундук наш — идеальное место, туда его и надо!» Я не придала значения — учителя у нас люди увлечённые."}, {"t": "p", "v": "Вчера перед обедом приходил худой юноша из старших классов. Что-то читал подолгу, подчёркивал карандашом — про сундук особенно, и про «возвращение к истоку». Кто это был — не скажу: читателей много, лица не запомнила, брошюру на полке потом нашла."}, {"t": "p", "v": "Показания даю добровольно, верно изложено, читала."}, {"t": "p", "v": "25 мая 1988 г.    Зинаида Павловна Никитина"}, {"t": "p", "v": "Пометка штаба: «идеальное место» — слова физика. Но юноша с брошюрой остаётся безымянным: нитка есть, имени нет."}]}, {"id": 20, "title": "Блокнот физика", "place": "Кабинет физики, стол", "blocks": [{"t": "p", "v": "Блокнот в клетку, записи карандашом. Заголовок первой страницы: «Пётр Сергеевич. Подготовка к линейке»."}, {"t": "p", "v": "20.05. Стенд собран. Камертон, осциллограф школьный (шт. №4), микрофон от радиоузла. Провода протянуты, Таня помогала тянуть вдоль плинтуса — молодец, порядок понимает. Нужен источник чистого тона для калибровки. Камертон 440 — маловато для демонстрации, скучно."}, {"t": "p", "v": "21.05. В библиотеке нашёл брошюру 68 года про наш колокольчик! Зинаида Павловна дала почитать в зале. Там частота — 660 герц. Если верно — идеально для стенда: одна нота, чистый тон, класс услышит. Взял формуляр — брошюра по правилам в зале остаётся, но переписал в блокнот главное."}, {"t": "p", "v": "24.05. 11:00–11:40 — колокольчик у меня по договорённости с директором (утренний замер). Основной тон ≈ 660 Гц. Совпало с брошюрой — до герца! Реликвия подлинная, сомнений нет. Вернул в 11:40. Далее — химик по расписке."}, {"t": "p", "v": "24.05, вечер. Демонстрационный прогон. Замер повторный — та же нота. Осциллограф работает чисто. Эксперимент окончен — 17:10. На линейке покажу вживую, на сцене."}, {"t": "p", "v": "На полях, торопливо, вразброс: «часы опять врут!! батарейку — к четвергу»; «в радиотовары до 18:00 — успеть!»; «сундук у сцены — резонанс?? проверить в субботу»."}]}, {"id": 21, "title": "Фото часов «17:10»", "place": "Кабинет физики, стенд", "blocks": [{"t": "p", "v": "Фотоснимок на стенде кабинета физики: демонстрационный прогон — осциллограф с чистой синусоидой, микрофон, камертон. В кадр сверху попали стенные часы кабинета: стрелки показывают 17:10."}, {"t": "p", "v": "Внизу кадра — приписка (почерк физика): «снимал после замера. По радио как раз объявили точное время — 16:45». Пометка штаба: часы кабинета спешат на 25 минут. «Эксперимент окончен — 17:10» из блокнота (№20) по точному времени — 16:45."}]}, {"id": 22, "title": "Плакат «Распространение звука»", "place": "Кабинет физики, стена", "blocks": [{"t": "p", "v": "Учебный плакат на стене кабинета физики: «РАСПРОСТРАНЕНИЕ ЗВУКА. Звуковые волны. Резонанс. Камертон и резонатор». Рисунки: волны от источника, колокол в резонаторе, осциллограф."}, {"t": "p", "v": "Внизу, под плакатом, приклеен клочок с записью (почерк физика): «Для опыта по резонансу нужен эталон чистого тона. Где взять? — есть идея!»"}, {"t": "p", "v": "Пометка штаба: мотив физика — идеальный опыт по акустике. Но мотив — не рука: надо искать, когда он мог унести колокольчик."}]}, {"id": 16, "title": "Ключ с биркой", "place": "Актовый зал, гвоздик у двери кладовой", "blocks": [{"t": "p", "v": "Ключ на гвоздике у двери кладовой реквизита. На бирке чернилами: «Кладовая реквизита. Выдаче не подлежит». Дверь отперта — ключ остаётся на гвоздике. Следов взлома на замке и дверной коробке нет."}, {"t": "p", "v": "Пометка штаба: никакого взлома не было — в кладовую входили «свои», знавшие порядок."}]}, {"id": 24, "title": "Схема декораций", "place": "Актовый зал, у сцены", "blocks": [{"t": "p", "v": "Лист ватмана у сцены: расстановка декораций к линейке. Слева помечена кулиса, за ней крестиком — сундук. Подпись под крестиком: «Сундук с реквизита к сцене под левую кулису — с прохода не виден». Внизу листа: «Н. В. М.»"}, {"t": "p", "v": "Пометка штаба: сундук не видно с прохода — то, кто знает схему, может унести колокольчик незаметно. Схема висит открыто."}]}, {"id": 23, "title": "Опись реквизита кладовой", "place": "Актовый зал, папка на пульте сцены", "blocks": [{"t": "p", "v": "«ОПИСЬ РЕКВИЗИТА КЛАДОВОЙ. Актовый зал, средняя школа № 2»:"}, {"t": "p", "v": "1. Декорации — 14 наименований. 2. Костюмы — в чемоданах, подписаны по классам. 3. Сундук дубовый, старый — историческая ценность, хранилище реквизита. Ключ — на гвоздике у двери, не выносить, дубликата нет. 4. Коробка деревянная (от задачников) — стояла у двери, использовать для упаковки декораций. 5. Занавес, шнуры, гирлянды — по списку."}, {"t": "p", "v": "Внизу приписка музея: «Сундук с 1965 года хранил школьный колокольчик — см. брошюру музея (ИНВ. № 1142). Память школы — не расходовать под дрова!»"}]}, {"id": 25, "title": "Коробка с кольцом в пыли", "place": "Кладовая, сундук", "blocks": [{"t": "p", "v": "В сундуке, поверх реквизита, — деревянная коробка из кладовой (та самая, «от задачников»). Коробка закрыта, крышка сверху запылилась ровно, без следов."}, {"t": "p", "v": "Внутри — пусто. На дне коробки — ровный слой пыли, в котором чёткое кольцо: отпечаток дна тяжёлого круглого предмета, лежавшего здесь раньше. Диаметр кольца совпадает с пробы №8 (внутренний обод колокольчика). Рядом в сундуке — порожнее место, пыль под ним сдвинута, будто предмет клали аккуратно, дном вниз."}, {"t": "p", "v": "Пометка штаба: колокольчик несли именно этой коробкой — бережно, не бросали. Человек знал, что везёт реликвию."}]}], "HINTS": {"1": ["Найдите запись за 24.05 на 18:35 — кто брал кофе с собой и что приметила буфетчица.", "Страница «Распоряжения»: чьё распоряжение о коробке переписала К. И.?"], "2": ["Кто заходил днём — взволнованная, торопилась, и что она велела насчёт коробки?", "Вечерняя фигура: во что одета, что несла, какой рост — смогла ли Смирнова определить пол?"], "3": ["Что видел Груздев утром у двери кладовой — кто прибивал записку и что она пояснила?", "Без четверти восемь: кто вышел за ворота — обернулся ли, куда пошла?"], "4": ["Рост фигуры «по косякам» — сколько? Во что одета, что несла под мышкой?", "Коробка «от задачников, от физика» — где она стояла и кто мог её взять?"], "5": ["Чьё слово запрещало трогать кладовую?", "Что тревожит второй голос — за что теперь отвечают?"], "6": ["Когда колокольчик принят и когда упакован — по какому документу принят?", "Что записано за 19:00–19:15 — где был химик в этот час?"], "7": ["Что найдено в кармане халата №2 — чьим почерком?", "Сверьте с №9: строчка из кармана совпадает со сценарием линейки?"], "8": ["Чья проба и с чего она взята?", "Законно ли химик брал пробу — что это меняет для версии?"], "9": ["Что зачёркнуто в сценарии и почему?", "Есть ли в тексте фамилия — или только «ученика 11-А»?"], "10": ["Кто, по записке, вызвался отнести колокольчик — и видела ли его организатор?", "Сверьте с №30: совпадает ли фигура на снимке?"], "11": ["Чья резолюция и что она утверждает?", "Инициатива завуча — что она меняет для версии группы?"], "12": ["Что видела Соколова около 18:00 у кабинета химии?", "Рост худого парня по её показаниям — сколько?"], "13": ["Рост Дёмина? Сравните с приметами фигуры (~170).", "Может ли Дёмин быть фигурой в белом с коробкой?"], "14": ["Кому выдан халат №2 — что написано в строке выдачи?", "Есть ли в журнале имя получателя — или только «со слов Тани»?"], "15": ["Чей ключ от актового зала не возвращён за 24.05?", "Что сделал сторож с дверью зала после Морозовой?"], "16": ["Где висел ключ кладовой и что на бирке?", "Нужен ли был взлом — или ключ был у всех на виду?"], "17": ["Где колокольчик хранился до 1968 года?", "Что написано про «трудные моменты реликвии»?"], "18": ["Кто читал брошюру 21.05 — фамилия?", "Вторая строка формуляра — чьё имя там стоит?"], "19": ["Что воскликнул физик, выписывая частоту?", "Второе упоминание в показаниях — о ком оно и можно ли его проверить?"], "20": ["Что записал физик после опыта — время и вывод?", "Куда указывает пометка «сундук — резонанс?? проверить»?"], "21": ["Что на фото и что передавало радио в момент снимка?", "Расхождение 17:10 и 16:45 — на сколько минут?"], "22": ["Какой опыт по плакату физик мог замерить в сундуке?", "Мотив есть — но хватает ли его без руки?"], "23": ["Что хранили в сундуке до 1968 года?", "Что написано про ключ сундука?"], "24": ["Где стоит сундук по схеме — виден ли с прохода?", "Почему «за левой кулисой» — удобно ли там спрятать?"], "25": ["Что за отпечаток на дне коробки?", "Что говорит форма отпечатка о том, что несли в коробке?"], "26": ["Кто составил график и вёл контроль?", "Сверьте с №27: что у организатора по графику до 19:00?"], "27": ["Кому директор велел немедленно доставить колокольчик — и до какого часа?", "С чем совпадает окно пропажи?"], "28": ["Где хранилась фиксация царапины — почему её не сдали в штаб?", "Кому царапина была невыгодна — и почему она вскрылась при химике?"], "29": ["Кто в кадре и для чего просила сделать снимок?", "Сверьте часы на фото: что они показывают?"], "30": ["Кто в кадре — назовите всех троих. Кто в белом халате?", "Чья подпись и что она говорит про халат №2?"], "31": ["Кто на снимке за брошюрой?", "Свяжите с №18: дата чтения совпадает?"], "32": ["Время и место чека — кто был у кассы?", "Что дописано на чеке — для кого спирт?"], "33": ["Что ставится лично на организатору?", "Сколько напоминаний получила Морозова за день — и почему это могло её напугать?"]}, "Q": {"1": [[3, "Что видел сторож Груздев утром 24 мая у двери кладовой?", ["Уборщицу, мыившую порог", "Организатора Морозову — прибивала записку", "Химика с пробирками", "Никого: кладовая была закрыта"], 1, "Груздев видел утром Наталью Викторовну у кладовой. Она пояснила: «Реквизит не трогать, всё расставлено по линейке»."], [15, "Чей ключ от актового зала не возвращён за 24 мая?", ["Ершова О. Б.", "Смирновой К. И.", "Морозовой Н. В. — НЕ ВОЗВРАЩЁН", "Ключ висит на гвоздике"], 2, "Ключ Морозовой не возвращён; дверь зала после неё не была заперта — сторож запер и опечатал сам."], [2, "Что велела Морозова буфетчице, уходя?", ["«Закройте буфет пораньше»", "«Если кто за коробкой придёт — никому не отдавайте, я сама распоряжаюсь»", "«Съешьте булочки за мой счёт»", "«Передайте завучу, что я задержусь»"], 1, "Организатор сама оставила за собой коробку из кладовой — «я сама распоряжаюсь». Кто ещё знал про коробку?"], [29, "Зачем Морозова просила снять её в буфете?", ["Для семейного альбома", "Для отчёта о подготовке линейки", "Случайно попала в кадр", "Она сама фотографировала буфет"], 1, "«Для отчёта» — она сама хотела зафиксировать, что была в буфете в 18:35. Заметьте: часы на стене идут неверно."], [1, "Какая запись стоит в тетради буфета за вечер 24 мая?", ["Ершов О. Б. — чай", "Двое из 11-А — пирожки в долг", "Морозова Н. В. — кофе с собой, 18:35, «про коробку говорила»", "Записей нет"], 2, "Последняя запись — кофе с собой организатору и её же распоряжение о коробке. Вечером — фигура в белом."], [33, "Чем угрожает завуч организатору?", ["Снять с репетиций", "Не пустить на линейку", "«Отвечать будете по всей строгости» — реквизит, колокольчик и порядок — лично на ней", "Перевести в другую школу"], 2, "Записка Орловой — двойное напоминание о личной ответственности за реликвию и кладовую."], [27, "Кто знал окно возврата колокольчика «до 19:00»?", ["Только директор", "Организатор — ей и адресовано требование немедленно доставить", "Только химик", "Об этом знал лишь сторож"], 1, "Окно пропажи совпадает с окном возврата. Организатор знала и часы, и порядок."], [26, "Кто единственный вёл график подготовки линейки?", ["Директор", "Завуч Орлова", "Морозова: «Составлен: Морозова Н. В.», «Распределение и контроль — лично я»", "Учитель физики"], 2, "График один — и его ведёт организатор. Она единственная знала всё расписание дня."], [5, "Чьё слово запрещало трогать кладовую?", ["Директора", "Натальи Викторовны — «кладовую не трогать, сказала Наталья Викторовна»", "Завуча", "Сторожа"], 1, "Технички шепчутся: теперь Морозова и за колокольчик отвечает, и за кладовую."], [4, "Как вернувшаяся Морозова подпадает под описание фигуры?", ["Никак — она была в магазине", "Вернувшаяся из магазина Морозова: «то ли женщина, то ли худой парень», рост ~170, коробка в её распоряжении", "Это Дёмин из 11-А", "Это физик"], 1, "Обе свидетельницы не смогли определить пол фигуры. По версии группы — это вернувшаяся организатор."]], "2": [[6, "Когда колокольчик исчез из лаборатории?", ["До 14:00", "Между 18:40 (упаковка) и 19:15 (возвращение химика)", "После 20:00", "Утром"], 1, "Химик отлучился в 19:00 на четверть часа — вернулся: коробки на столе нет. Окно пропажи — его собственное."], [28, "Почему фиксация царапины осталась в сейфе?", ["Забыл отдать в штаб", "Химик сам спрятал: царапина вскрылась при нём — за порчу реликвии отвечать ему", "Плёнка засвечена", "Это снимок не колокольчика"], 1, "Фото спрятано, в формуляр не внесено. По версии группы: Ершов скрывал повреждение, случившееся в его лаборатории."], [8, "Что подтверждает проба №2?", ["Колокольчик — подделка", "Химик брал микропробы с обода: реликвия была в его руках", "Проба взята из кладовой", "Проба с рук старосты"], 1, "Проба №2 снята с внутреннего обода колокольчика — законно, по регламенту. Реликвия была у него."], [30, "Кто третий на фото 18:35?", ["Уборщица", "Худой парень в белом халате №2 — «напросился помочь»", "Директор", "Завуч"], 1, "В кадре — Ершов, Таня Крылова и худой парень в халате №2. По версии группы — исполнитель, которого привёл химик."], [14, "Как выдан халат №2?", ["Ершову по журналу", "«Помощнику старосты» — со слов Тани Крыловой, без подписи получателя", "Не выдавался", "Сторожу"], 1, "Халат получил тот, кого никто не назначал, а выдачу подтвердил только голос."], [7, "Что найдено в кармане халата №2?", ["Расписание уроков", "Выписанная карандашом строчка реплики — та самая, что убрали из сценария", "Чек", "Пробирка"], 1, "В кармане — строчка реплики. Совпадёт со сценарием №9 — но окончательно это защёлкнется только на совещании."], [32, "Где была организатор в 19:12?", ["В актовом зале", "У кассы гастронома «Кузнецк» — значит, в лаборатории оставался только химик", "В буфете", "Дома"], 1, "Чек 19:12 — организатор физически за воротами. В лаборатории в этот час был один человек — Ершов."], [10, "Что говорит записка организатора?", ["«Отнести колокольчик вызвался помощник Тани Крыловой; сама я его воочию не видела»", "«Колокольчик отдан директору»", "Только «Ушла за спиртом»", "Жалоба на завуча"], 0, "Организатор не видела помощника воочию — и не могла его опознать. След ведёт в лабораторию."], [9, "Что помечено в сценарии линейки?", ["Реплика одного ученика выделена жирным", "«Реплику ученика 11-А вычеркнуть — слишком длинная» — без фамилии", "Новый порядок выступлений", "Замечание к актовому залу"], 1, "Фамилии в редакции нет. Кто и зачем вычеркнул — вопрос к завучу."], [11, "Чья резолюция на сценарии?", ["Директора", "Завуча Орловой — «Регламент. Убрать. И. С.»", "Организатора", "Старосты"], 1, "Инициатива завуча, не химика. Но репетировали реплику три недели — в классе 11-А."], [12, "Что видела классрук около 18:00?", ["Физика у кладовой", "Худого парня у кабинета химии — метр семьдесят", "Организатора у ворот", "Никого"], 1, "Соколова: «готовил реплику один из выпускников» и видела худого парня у химии — метр семьдесят."], [13, "Почему Дёмин отпадает?", ["Он на репетиции", "Рост 182 — фигура ниже, около 170. Остаётся загадочный «помощник»", "Он болел", "Он в библиотеке"], 1, "Дёмин — 182. Фигура — около 170. Совпадений нет."]], "3": [[17, "Где колокольчик хранился до 1968 года?", ["В сейфе директора", "В дубовом сундуке в кладовой — «в трудные моменты реликвии возвращают туда, где начинались»", "В библиотеке", "В лаборатории"], 1, "Брошюра 1968 года прямо называет место «начинания» реликвии — дубовый сундук в кладовой."], [18, "Кто читал брошюру перед событиями?", ["Пётр Сергеевич — 21.05", "Староста", "Завуч", "Директор"], 0, "Формуляр: читал П. С. — физик, за два дня до праздника."], [31, "Кто на фото за брошюрой?", ["Директор", "Пётр Сергеевич", "Организатор", "Химик"], 1, "На снимке — физик за брошюрой. Формуляр связывается с лицом."], [19, "Что воскликнул физик в библиотеке?", ["«Отличная погода!»", "«Идеальное место!» — про сундук", "«Скучно тут»", "Ничего — молчал"], 1, "Никитина слышала: выписал частоту — и воскликнул про «идеальное место»."], [20, "Что записал физик в блокноте?", ["«ЭКСПЕРИМЕНТ ОКОНЧЕН — 17:10» и «сундук — резонанс?? проверить»", "План урока", "Список приборов", "Расписание занятий"], 0, "В блокноте — и время окончания опыта, и прямая пометка про сундук."], [21, "Часы на фото — 17:10, по радио — 16:45. Что это значит?", ["Часы отстают", "Кабинетные часы спешат на 25 минут — записи времени по ним сдвинуты", "Фото сделано в другой день", "Радио врёт"], 1, "Стенные часы кабинета физики спешат на 25 минут. Все записи «по кабинетным часам» сдвинуты."], [22, "Какой опыт хотел поставить физик?", ["Опыт по резонансу — звучание колокольчика в сундуке", "Опыт по оптике", "Химический опыт", "Никакого"], 0, "Плакат «Распространение звука» — материал для акустического опыта с реликвией."], [16, "Как попасть в кладовую без взлома?", ["Никак — двери крепкие", "Ключ висел у двери, бирка «выдаче не подлежит» — знающий просто взял", "Через окно", "По секрету от сторожа"], 1, "Никакого взлома: ключ — у двери. Тот, кто знал, что он там, взял и положил обратно."], [24, "Где стоит сундук по схеме декораций?", ["На середине сцены", "За левой кулисой — с прохода не видно", "В кабинете физики", "В буфете"], 1, "Сундук за левой кулисой: с прохода не виден. «Идеальное место» — как сказал физик."], [23, "Что хранили в сундуке до 1968 года?", ["Колокольчик — до вручения выпускникам", "Архивные бумаги", "Только реквизит", "Ничего"], 0, "Опись: тут колокольчик хранился до 1968-го. Ключ сундука — «выдаче не подлежит»."], [25, "Что за отпечаток на дне коробки?", ["Кольцо дужки колокольчика — его несли в этой коробке, аккуратно", "Пыль без следов", "След ботинка", "Кольцо сторожа"], 0, "Отпечаток дужки в пыли: колокольчик несли в этой коробке. Рядом — порожняя тара."]]}, "ORDER": {"1": [3, 15, 2, 29, 1, 33, 27, 26, 5, 4], "2": [6, 28, 8, 30, 14, 7, 32, 10, 9, 11, 12, 13], "3": [17, 18, 31, 19, 20, 21, 22, 16, 24, 23, 25]}, "ROUTE_META": {"1": {"name": "Маршрут 1 — «Виновата организатор»", "zones": "буфет → проходная → кабинет директора → подсобка уборщицы", "suspect": "Наталья Викторовна Морозова"}, "2": {"name": "Маршрут 2 — «Виноват химик»", "zones": "кабинет химии с лабораторией → учительская → архив", "suspect": "Олег Борисович Ершов"}, "3": {"name": "Маршрут 3 — «Виноват физик»", "zones": "библиотека → кабинет физики → актовый зал → кладовая", "suspect": "Пётр Сергеевич"}}, "DOSSIER": [["Ковалёв А. С.", "директор школы", "—", "Полвека с реликвией. Велел немедленно доставлять колокольчик лично до 19:00."], ["Орлова И. С.", "завуч", "—", "Регламент линейки. Резолюция: реплику вычеркнуть."], ["Морозова Н. В.", "организатор линейки", "—", "В 18:45 ушла за ворота с авоськой, в 19:30 вернулась. Ключ актового зала не сдала."], ["Ершов О. Б.", "учитель химии", "180 см", "Колокольчик был в его лаборатории до 19:00. В 19:00 отлучился к завучу."], ["Пётр Сергеевич", "учитель физики", "—", "Читал брошюру, замерял тон 660 Гц, воскликнул «идеальное место!»."], ["Смирнова К. И.", "буфетчица", "—", "Видела днём и вечером; пол фигуры не различила."], ["Лебедева Т. Ф.", "уборщица", "—", "Рост меряет по косякам: фигура — около 170."], ["Груздев М. И.", "сторож", "—", "Дежурство с 16:00. Дверь кладовой «всегда скрипит»."], ["Никитина", "библиотекарь", "—", "Видела, кто читал брошюру, и слышала реплику про «идеальное место»."], ["Соколова", "классный руководитель 11-А", "—", "Три недели репетиций с учеником; около 18:00 видела худого парня у химии."], ["Крылова Т.", "староста 11-А", "—", "Держала повторный опыт; помощника не назначала."], ["Дёмин", "ученик 11-А", "182 см", "Слишком высокий для фигуры в белом (~170)."], ["Лапин Витя", "ученик 11-А", "171 см", "Тихий. Готовил реплику для линейки."]], "LETTER": ["ШТАБ СЛЕДСТВИЯ — СЛУЖЕБНОЕ ПИСЬМО", "Средняя школа №2. 24 мая 1988 года, 21:00.", "Товарищи следователи! В 21:00 в буфете объявлено: в актовом зале исчез бронзовый колокольчик — реликвия выпускников 1968 года. Пропажу обнаружила старшая пионервожатая Марина Львовна.", "Зоны опечатаны штабом. У каждой группы — своя зона и своя версия штаба. Три главные версии штаба:", "— организатор Морозова (зона маршрута 1);", "— учитель химии Ершов (зона маршрута 2);", "— учитель физики Пётр Сергеевич (зона маршрута 3).", "Работайте строго в своей зоне: чужие двери опечатаны. Вскрывайте улики по номерам и проходите лестницу вопросов — вопросы открываются по одному, каждый следующий только после разбора предыдущего.", "После лестницы зафиксируйте официальную версию группы (вкладка «Проверить версию») и сообщите её жюри на общем совещании. Совещание открывается кодом СОВЕЩАНИЕ в поле ввода.", "Начальник штаба — Марина Львовна."], "MAP": {"title": "КАРТА ШКОЛЫ. Зоны маршрутов", "rows": [["Зона", "Маршрут", "Кабинеты и объекты", "Версия группы"], ["Маршрут 1", "«Организатор»", "буфет → проходная → кабинет директора → подсобка уборщицы", "Наталья Викторовна Морозова"], ["Маршрут 2", "«Химик»", "кабинет химии с лабораторией → учительская → архив", "Олег Борисович Ершов"], ["Маршрут 3", "«Физик»", "библиотека → кабинет физики → актовый зал → кладовая", "Пётр Сергеевич"]], "note": "Сундук с реквизитом — за левой кулисой актового зала. Двери чужих зон опечатаны штабом."}, "MEETING_TEXT": ["Кабинет директора. За столом — директор Ковалёв, завуч Орлова, вожатая Марина Львовна.", "КОВАЛЁВ: — Докладывайте версии.", "Ваша официальная версия группы: {VER}.", "ПЕРЕКРЁСТНАЯ СВЕРКА. Директор выслушивает три версии и громит их в порядке:", "— Версия «организатор»: 19:12, касса гастронома «Кузнецк» — чек №32. В момент пропажи колокольчика Морозова была за воротами школы. Версия рушится.", "— Версия «физик»: фото №21 — кабинетные часы спешат на 25 минут. «Эксперимент окончен» — реальные 16:45. Дальше физик ушёл в «Радиотовары» за батарейкой — в момент пропажи его в школе не было. Версия рушится.", "— Версия «химик»: показания уборщицы №4 — фигура ростом около 170. Химик — 180. И в 19:00 он ушёл к завучу помогать с реквизитом. Версия рушится.", "КОВАЛЁВ: — Все три версии разбились. Осталась одна ниточка: помощник старосты на повторном опыте — тот, кого никто не назначал. Кто назовёт его имя?"], "ENVELOPE": ["КОНВЕРТ ВСКРЫТ. Показания Тани Крыловой, старосты 11-А:", "«После опыта, в 18:40, меня позвали на прогон. Витя Лапин напросился на опыт сам — я его не просила. Уходя, он взял коробку и сказал: „Отнесу сам“. Я подумала — отнесёт Олегу Борисовичу. Куда он её понёс — не знаю. Честно.»"], "FINAL1": {"q": "Шаг 1. Кто единственный назовёт имя помощника?", "opts": ["Сторож Груздев", "Классный руководитель Соколова", "Староста Таня Крылова", "Буфетчица Смирнова"], "correct": 2, "why": "Таня держала повторный опыт — только она знает, кто был помощником."}, "FINAL_NAMES": ["Ковалёв А. С.", "Орлова И. С.", "Морозова Н. В.", "Ершов О. Б.", "Пётр Сергеевич", "Смирнова К. И.", "Лебедева Т. Ф.", "Груздев М. И.", "Никитина", "Соколова", "Крылова Т.", "Дёмин", "Лапин Витя"], "FINAL3": {"q": "Шаг 3. Где колокольчик?", "opts": ["В сейфе директора", "В лаборатории химика", "В сундуке с реквизитом в кладовой", "Унесён из школы"], "correct": 2, "why": "Брошюра №17 и опись №23: реликвия «начиналась» в сундуке. Ведущий отправляет группу в кладовую — в сундуке деревянная коробка, в ней колокольчик."}, "WRONG_HINT": "Сверьте с приметами: худой, рост около 170, белый халат №2, деревянная коробка под мышкой, у буфета около 19:00, напросился помощником на опыт.", "MONOLOGUE": ["Витя Лапин — тихо, глядя в пол:", "«Я не крал его, товарищ директор. Я только вернул его на место.", "Я три недели готовил одну строчку. Три недели репетировал, чтобы на линейке её услышали. А вчера мне сказали: реплика длинная, вычёркиваем. Никто даже не заметил, что я готовился.", "Вчера утром я прочитал в библиотеке брошюру про наш колокольчик. Там написано: в трудные моменты реликвии возвращают туда, где они начинались.", "Я напросился на повторный опыт помощником, надел белый халат. Когда Таню позвали на прогон, я взял коробку и сказал: „Отнесу сам“. И отнёс — в кладовую, в сундук. Я знал, куда: до шестьдесят восьмого года колокольчик лежал в сундуке. Я хотел, чтобы линейка не состоялась. Чтобы все поняли: без моей строчки праздник не тот.", "Я не хотел красть. Я вернул реликвию туда, где её место. Я ведь не знал, что Олегу Борисовичу полагалось отнести его вам — до девяти вечера, лично в кабинет. Про это в брошюре не было ни слова.", "Струсил сказать сразу. Простите.»"], "DIRECTOR": ["КОВАЛЁВ (после долгой паузы):", "«Реплику вернём. Завтра — первым словом линейки. А колокольчик ты и понесёшь. Сам. И поставишь на место — перед всей школой.»"], "FINAL_NOTE": "Ведущий открывает кладовую. В сундуке — деревянная коробка. В ней — колокольчик. Реликвия вернулась туда, где начиналась.", "LEADING": ["ПАМЯТКА ВЕДУЩЕМУ", "1. Раздайте группы по маршрутам 1/2/3: у каждой — своя зона и своя версия штаба (Морозова / Ершов / Пётр Сергеевич).", "2. Раскладывайте улики в кабинетах со стикерами-номерами заранее, по списку зон.", "3. До игры положите колокольчик (макет) в сундук в кладовой — финальная находка.", "4. Терминал: ввод номера = вскрытие улики; лестница вопросов идёт строго по порядку; чужие зоны — «дверь опечатана».", "5. После лестницы группа фиксирует официальную версию (вкладка «Проверить версия») и докладывает её жюри. Совещание — код СОВЕЩАНИЕ.", "6. На совещании три версии рушатся перекрёстной сверкой: чек №32 — против Морозовой, фото часов №21 — против Петра Сергеевича, рост по показаниям №4 — против Ершова.", "7. Затем: конверт Тани → выбор виновного из всех действующих персонажей → «где колокольчик?» → развязка.", "8. Монолог Вити читает ведущий голосом Вити. Директор произносит финальные слова."]};

  if(S.meeting){el.innerHTML=meetingHTML();return}
  el.innerHTML=shellHTML();
}
/* ---------- СТАРТОВЫЙ ЭКРАН ---------- */
function startHTML(){
  var h='<h1 class="center">ДЕЛО №13</h1><h2 class="center">«ПРОПАВШИЙ КОЛОКОЛЬЧИК»</h2>';
  h+='<p class="dim center">Терминал следствия · средняя школа №2 · 24 мая 1988 года</p>';
  if(S.saved){h+='<div class="card"><p>Найдено незавершённое дело: группа «'+esc(S.team)+'», маршрут '+S.route+'. Найдено улик: '+S.opened.length+' из 33.</p><button class="acc" onclick="resume()">ПРОДОЛЖИТЬ НЕЗАВЕРШЁННОЕ ДЕЛО</button></div>'}
  h+='<div class="card"><h3>Регистрация следственной группы</h3>';
  h+='<p>Название группы:</p><input id="teamName" maxlength="40" value="'+esc(S.team)+'" placeholder="Например: «След 11-А»">';
  h+='<p>Цифра маршрута (1, 2 или 3):</p><input id="routeNum" maxlength="1" value="'+(S.pendingRoute||'')+'" placeholder="1 / 2 / 3">';
  if(S.startErr)h+='<p class="bad">'+esc(S.startErr)+'</p>';
  h+='<p><button class="acc" onclick="startDraft()">ДАЛЕЕ →</button></p></div>';
  return h;
}
function startDraft(){
  var t=(document.getElementById('teamName').value||'').trim();
  var r=(document.getElementById('routeNum').value||'').trim();
  if(!t){S.startErr='Сначала впишите название группы';S.saved=false;S.route=null;S.pendingRoute=r;save();renderApp();return}
  if(!(r==='1'||r==='2'||r==='3')){S.startErr='Введите цифру маршрута: 1, 2 или 3';S.saved=false;S.route=null;S.pendingRoute=r;save();renderApp();return}
  S.pendingRoute=+r;S.startErr=null;S.teamDraft=t;S.confirmDraft=true;S.saved=false;save();renderApp();
}
function renderConfirm(){var el=document.getElementById('app');el.innerHTML=confirmHTML()}
function confirmHTML(){
  var r=S.pendingRoute,m=DATA.ROUTE_META[String(r)];
  var h='<h2 class="center">ПОДТВЕРЖДЕНИЕ МАРШРУТА '+r+'</h2>';
  h+='<div class="card"><p>Группа: <span class="acc">'+esc(S.teamDraft)+'</span></p>';
  h+='<p>Маршрут: <span class="acc">'+esc(m.name)+'</span></p>';
  h+='<p>Зоны: '+esc(m.zones)+'</p>';
  h+='<p>Подозреваемый по версии штаба: <span class="acc">'+esc(m.suspect)+'</span></p>';
  h+='<p class="dim">Порядок обхода (лестница вопросов): '+DATA.ORDER[String(r)].join(' → ')+'</p>';
  if(S.startErr)h+='<p class="bad">'+esc(S.startErr)+'</p>';
  h+='<p><button class="acc" onclick="confirmRoute()">ДА, ЭТО НАШ МАРШРУТ</button><button onclick="backStart()">← НАЗАД</button></p></div>';
  return h;
}
function confirmRoute(){S.team=S.teamDraft;S.route=S.pendingRoute;S.opened=[];S.step=0;S.version='';S.tab='codes';S.meeting=false;S.fin=0;S.saved=false;save();renderApp()}
function backStart(){S.confirmDraft=false;S.pendingRoute=null;S.startErr=null;save();renderApp()}
function resume(){S.saved=false;save();renderApp()}
/* ---------- ОБОЛОЧКА ---------- */
function shellHTML(){
  var h='<div class="hdr"><span class="t">ДЕЛО №13 · «ПРОПАВШИЙ КОЛОКОЛЬЧИК» · '+esc(S.team)+'</span>';
  h+='<span>21:00</span><span><button class="fold" onclick="toggleFolder()">📁 Папка ('+S.opened.length+'/33)</button> <button onclick="toggleMenu()">☰ Меню</button></span></div>';
  if(S.menuOpen)h+=menuHTML();
  h+='<div class="tabs"><button class="'+(S.tab==='codes'?'on':'')+'" onclick="setTab(\'codes\')">Поле и коды</button><button class="'+(S.tab==='version'?'on':'')+'" onclick="setTab(\'version\')">Проверить версию</button><button class="'+(S.tab==='docs'?'on':'')+'" onclick="setTab(\'docs\')">Документы</button></div>';
  h+='<div class="panel">'+(S.tab==='codes'?codesHTML():S.tab==='version'?versionHTML():docsHTML())+'</div>';
  if(S.view)h+=viewHTML();
  if(S.folderOpen)h+=folderHTML();
  return h;
}
function setTab(t){S.tab=t;S.answerMsg=null;save();renderApp()}
function menuHTML(){
  var h='<div class="card"><h3>МЕНЮ ТЕРМИНАЛА</h3><p><button class="acc" onclick="toggleMenu()">← Вернуться к делу</button></p><p><button onclick="exitToStart()">ВЫХОД НА ГЛАВНЫЙ ЭКРАН</button> <span class="dim">— прогресс сохранится</span></p><p><button class="bad" onclick="askReset()">СБРОСИТЬ ДЕЛО</button></p><p><button onclick="showLeading()">ПАМЯТКА ВЕДУЩЕМУ</button></p></div>';
  return h;
}
function toggleMenu(){S.menuOpen=!S.menuOpen;save();renderApp()}
function exitToStart(){S.menuOpen=false;S.saved=true;save();renderApp()}
function askReset(){if(confirm('Сбросить дело полностью? Прогресс группы будет потерян.')){S={team:'',route:null,opened:[],step:0,version:'',tab:'codes',meeting:false,fin:0,answerMsg:null,view:null,folderOpen:false,folderSeen:false};save();renderApp()}}
function showLeading(){S.view={type:'leading'};save();renderApp()}
function toggleFolder(){S.folderOpen=!S.folderOpen;if(S.folderOpen)S.folderSeen=true;save();renderApp()}
/* ---------- ПОЛЕ И КОДЫ ---------- */
function codesHTML(){
  var order=DATA.ORDER[String(S.route)];
  var h='<h3>ПОЛЕ И КОДЫ</h3>';
  h+='<p class="dim">Введите номер улики со стикера в вашей зоне. Совещание открывается кодом СОВЕЩАНИЕ — после фиксации версии.</p>';
  h+='<p><input id="codeIn" placeholder="Номер улики или код СОВЕЩАНИЕ" onkeydown="if(event.key===\'Enter\')submitCode()"></p>';
  h+='<p><button class="acc" onclick="submitCode()">ВСКРЫТЬ</button></p>';
  if(S.codeMsg)h+='<div class="msg'+(S.codeOk?'':' bad')+'">'+esc(S.codeMsg)+'</div>';
  if(S.opened.length>0){h+='<p class="dim">Вскрыто улик: '+S.opened.length+'. Текущий шаг лестницы: №'+order[Math.min(S.step,order.length-1)]+(S.step>=order.length?' (лестница пройдена)':'')+'.</p>'}
  return h;
}
function submitCode(){
  var v=(document.getElementById('codeIn').value||'').trim();
  if(!v)return;
  S.codeMsg=null;
  if(v.toUpperCase()==='СОВЕЩАНИЕ'){
    if(!S.version){S.codeOk=false;S.codeMsg='Совещание соберётся только после того, как группа зафиксирует официальную версию (вкладка «Проверить версию»).'}
    else{S.meeting=true;S.fin=0;save();renderApp();return}
  } else if(/^\d{1,2}$/.test(v)){
    openItem(+v);
  } else {S.codeOk=false;S.codeMsg='Код не распознан. Введите номер улики или код СОВЕЩАНИЕ.'}
  save();renderApp();
}
function openItem(n){
  var order=DATA.ORDER[String(S.route)];
  var idx=order.indexOf(n);
  if(idx<0){S.codeOk=false;S.codeMsg='ДВЕРЬ ОПЕЧАТАНА ШТАБОМ. Улика №'+n+' — не в вашей зоне. Работайте по своей.';return}
  if(S.opened.indexOf(n)>=0){S.codeOk=true;S.codeMsg='Улика №'+n+' уже в папке. Откройте её во вкладке «Проверить версию».';return}
  if(idx>S.step){S.codeOk=false;S.codeMsg='Лестница ведёт следствие по порядку. Сначала раскройте улику №'+order[S.step]+'.';return}
  S.opened.push(n);S.codeOk=true;
  S.codeMsg='Улика №'+n+' вскрыта и добавлена в папку ('+S.opened.length+'/33). Переходите к разбору во вкладке «Проверить версию».';
}
/* ---------- ЛЕСТНИЦА ВОПРОСОВ / ВЕРСИЯ ---------- */
function versionHTML(){
  var order=DATA.ORDER[String(S.route)];
  var h='<h3>ЛЕСТНИЦА ВОПРОСОВ</h3>';
  h+='<p class="dim">Вопросы открываются по одному: каждый следующий — только после разбора предыдущего. Улику шага вскрывайте в «Поле и коды».</p>';
  for(var i=0;i<order.length;i++){
    var it=byId(order[i]);var q=qOf(order[i]);
    if(i<S.step){
      h+='<div class="step done">✅ №'+order[i]+' — '+esc(it.title)+'<div class="dim">Вопрос закрыт: '+esc(q[1])+'</div></div>';
    } else if(i===S.step){
      h+='<div class="step"><b class="acc">ШАГ '+(i+1)+' · УЛИКА №'+order[i]+': '+esc(it.title)+'</b>';
      if(S.opened.indexOf(order[i])<0){
        h+='<p class="dim">Улика ещё не вскрыта. Найдите её в зоне и введите номер в «Поле и коды».</p>';
        h+='<p><button onclick="goCode('+order[i]+')">Перейти к полю ввода — улика №'+order[i]+'</button></p>';
        h+='<p class="dim">Подсказка: '+esc(DATA.HINTS[String(order[i])][0])+'</p>';
      } else {
        h+='<p class="dim">Место: '+esc(it.place)+'</p><p><button onclick="viewItem('+order[i]+')">ПРОЧИТАТЬ УЛИКУ №'+order[i]+'</button></p>';
        h+='<p><b>'+esc(q[1])+'</b></p>';
        for(var j=0;j<q[2].length;j++){h+='<button class="opt" onclick="answer('+j+')">'+(j+1)+'. '+esc(q[2][j])+'</button>'}
        if(S.answerMsg)h+='<div class="msg'+(S.answerOk?'':' bad')+'">'+esc(S.answerMsg)+'</div>';
      }
      h+='</div>';
    } else {h+='<div class="step lock">🔒 №'+order[i]+' — '+esc(it.title)+' <span class="dim">(закрыт до разбора предыдущего шага)</span></div>'}
  }
  if(S.step>=order.length){
    if(!S.version){
      h+='<div class="card"><h3>ЛОКАЛЬНЫЙ ФИНАЛ: ФИКСАЦИЯ ВЕРСИИ</h3>';
      h+='<p>Лестница пройдена. По материалам вашей зоны сформулируйте версию и впишите имя подозреваемого группы.</p>';
      h+='<p><input id="verName" placeholder="Имя и фамилия подозреваемого"></p>';
      h+='<p><button class="acc" onclick="fixVersion()">ЗАФИКСИРОВАТЬ ОФИЦИАЛЬНУЮ ВЕРСИЮ</button></p>';
      if(S.fixErr)h+='<p class="bad">'+esc(S.fixErr)+'</p></div>';
    } else {
      h+='<div class="card"><h3>ПРОТОКОЛ ВЕРСИИ</h3>';
      h+='<p>ОФИЦИАЛЬНАЯ ВЕРСИЯ ГРУППЫ «'+esc(S.team)+'»: <span class="acc big">'+esc(S.version)+'</span></p>';
      h+='<p>Версия записана в протокол №13-'+S.route+' и изменению не подлежит.</p>';
      h+='<p class="acc"><b>Сообщите эту версию жюри на совещании.</b> Совещание открывается кодом СОВЕЩАНИЕ в «Поле и коды».</p></div>';
    }
  }
  return h;
}
function goCode(n){S.tab='codes';S.codeInPrefill=n;save();renderApp();var el=document.getElementById('codeIn');if(el){el.value=String(n);el.focus()}}
function answer(i){
  var order=DATA.ORDER[String(S.route)];var q=qOf(order[S.step]);
  if(i===q[3]){S.step++;S.answerOk=true;S.answerMsg='ВЕРНО. '+q[4];}
  else{S.answerOk=false;S.answerMsg='ОТВЕТ НЕ ПОДТВЕРЖДАЕТСЯ МАТЕРИАЛАМИ ДЕЛА. Перечитайте улику №'+q[0]+' — и подсказку к ней.'}
  save();renderApp();
}
function fixVersion(){
  var n=(document.getElementById('verName').value||'').trim();
  if(!n){S.fixErr='Впишите имя подозреваемого — версия группы должна быть сформулирована';save();renderApp();return}
  S.version=n;S.fixErr=null;save();renderApp();
}
/* ---------- ДОКУМЕНТЫ ---------- */
function docsHTML(){
  var h='<h3>ДОКУМЕНТЫ ШТАБА</h3>';
  h+='<div class="card"><b class="acc">'+esc(DATA.LETTER[0])+'</b>';
  for(var i=1;i<DATA.LETTER.length;i++)h+='<p>'+esc(DATA.LETTER[i])+'</p>';
  h+='</div>';
  h+='<div class="card"><h4 class="acc">ДОСЬЕ ПОДОЗРЕВАЕМЫХ (13 карточек)</h4><table class="dossier"><tr><th>Фамилия</th><th>Роль</th><th>Рост</th><th>Примечание штаба</th></tr>';
  for(var i=0;i<DATA.DOSSIER.length;i++){var d=DATA.DOSSIER[i];h+='<tr><td>'+esc(d[0])+'</td><td>'+esc(d[1])+'</td><td>'+esc(d[2])+'</td><td>'+esc(d[3])+'</td></tr>'}
  h+='</table></div>';
  h+='<div class="card"><b class="acc">'+esc(DATA.MAP.title)+'</b><table><tr>';
  var hdr=DATA.MAP.rows[0];for(var c=0;c<hdr.length;c++)h+='<th>'+esc(hdr[c])+'</th>';
  h+='</tr>';
  for(var r=1;r<DATA.MAP.rows.length;r++){h+='<tr>';for(var c=0;c<hdr.length;c++)h+='<td>'+esc(DATA.MAP.rows[r][c])+'</td>';h+='</tr>'}
  h+='</table><p class="dim">'+esc(DATA.MAP.note)+'</p></div>';
  return h;
}
/* ---------- ПАПКА И ПРОСМОТР ---------- */
function folderHTML(){
  var h='<div class="card"><h3>📁 ПАПКА ДЕЛА ('+S.opened.length+'/33)</h3>';
  if(S.opened.length===0)h+='<p class="dim">Пока пусто. Вводите номера улик в «Поле и коды».</p>';
  for(var i=0;i<S.opened.length;i++){var it=byId(S.opened[i]);h+='<button class="folditem" onclick="viewItem('+it.id+')">№'+it.id+' — '+esc(it.title)+'</button>'}
  h+='<p><button onclick="toggleFolder()">ЗАКРЫТЬ ПАПКУ</button></p></div>';
  return h;
}
function viewItem(id){S.view={type:'item',id:id};S.folderOpen=false;save();renderApp()}
function closeView(){S.view=null;save();renderApp()}
function viewHTML(){
  var h='';var d=S.view;
  h+='<div class="card" style="border-color:var(--acc)"><div style="text-align:right"><button onclick="closeView()">✕ ЗАКРЫТЬ</button></div>';
  if(d.type==='leading'){
    for(var i=0;i<DATA.LEADING.length;i++){var t=DATA.LEADING[i];h+=(i===0?'<b class="acc">'+esc(t)+'</b>':'<p>'+esc(t)+'</p>')}
    h+='</div>';return h;
  }
  var it=byId(d.id);
  h+='<h3>УЛИКА №'+it.id+' — '+esc(it.title)+'</h3><p class="dim">Место: '+esc(it.place)+'</p>';
  for(var b=0;b<it.blocks.length;b++){var blk=it.blocks[b];
    if(blk.t==='p')h+='<p>'+esc(blk.v)+'</p>';
    if(blk.t==='table'){h+='<table>';for(var r=0;r<blk.rows.length;r++){h+='<tr>';for(var c=0;c<blk.rows[r].length;c++)h+=(r===0?'<th>':'<td>')+esc(blk.rows[r][c])+(r===0?'</th>':'</td>')}h+='</table>'}
  }
  var hints=DATA.HINTS[String(it.id)];
  if(hints){h+='<div class="msg dim">ПОДСКАЗКИ ШТАБА: 1) '+esc(hints[0])+' 2) '+esc(hints[1]||'')+'</div>'}
  h+='</div>';
  return h;
}
/* ---------- СОВЕЩАНИЕ И ФИНАЛ ---------- */
function meetingHTML(){
  var h='<div class="hdr"><span class="t">ОБЩЕЕ СОВЕЩАНИЕ · КАБИНЕТ ДИРЕКТОРА</span><span>21:00</span></div>';
  h+='<div class="panel">';
  if(S.fin===0){
    for(var i=0;i<DATA.MEETING_TEXT.length;i++){var t=DATA.MEETING_TEXT[i].replace('{VER}',S.version);h+='<p'+(t.indexOf('КОВАЛЁВ')===0?' class="acc"':'')+'>'+esc(t)+'</p>'}
    h+='<p class="dim">Ваша версия, как и версии двух других групп, зафиксирована в протоколе. Директор слушает и сверяет.</p>';
    h+='<p><button class="acc" onclick="meetNext()">ПРОДОЛЖИТЬ</button></p>';
  } else if(S.fin===1){
    h+='<p><b class="acc">'+esc(DATA.FINAL1.q)+'</b></p>';
    for(var j=0;j<DATA.FINAL1.opts.length;j++)h+='<button class="opt" onclick="final1('+j+')">'+(j+1)+'. '+esc(DATA.FINAL1.opts[j])+'</button>';
    if(S.f1msg)h+='<div class="msg bad">'+esc(S.f1msg)+'</div>';
  } else if(S.fin===2){
    h+='<p class="acc"><b>'+esc(DATA.ENVELOPE[0])+'</b></p>';
    for(var i=1;i<DATA.ENVELOPE.length;i++)h+='<p>'+esc(DATA.ENVELOPE[i])+'</p>';
    h+='<p><button class="acc" onclick="meetNext()">ПРОДОЛЖИТЬ</button></p>';
  } else if(S.fin===3){
    h+='<p><b class="acc">Шаг 2. Кто виноват? Выберите из всех действующих персонажей.</b></p>';
    for(var k=0;k<DATA.FINAL_NAMES.length;k++)h+='<button class="namebtn" onclick="chooseCulprit(\''+DATA.FINAL_NAMES[k].replace(/'/g,"\\'")+'\')">— '+esc(DATA.FINAL_NAMES[k])+'</button>';
    if(S.f2msg)h+='<div class="msg bad">'+esc(S.f2msg)+'</div>';
  } else if(S.fin===4){
    h+='<p><b class="acc">'+esc(DATA.FINAL3.q)+'</b></p>';
    for(var j=0;j<DATA.FINAL3.opts.length;j++)h+='<button class="opt" onclick="final3('+j+')">'+(j+1)+'. '+esc(DATA.FINAL3.opts[j])+'</button>';
    if(S.f3msg)h+='<div class="msg bad">'+esc(S.f3msg)+'</div>';
  } else if(S.fin===5){
    h+='<div class="card">';
    for(var i=0;i<DATA.MONOLOGUE.length;i++)h+='<p'+(i===0?' class="acc"':' class="mono-space"')+'>'+esc(DATA.MONOLOGUE[i])+'</p>';
    for(var i=0;i<DATA.DIRECTOR.length;i++)h+='<p class="acc mono-space">'+esc(DATA.DIRECTOR[i])+'</p>';
    h+='<p><b class="acc">'+esc(DATA.FINAL_NOTE)+'</b></p>';
    h+='<p class="center dim">ДЕЛО №13 ЗАКРЫТО. СПАСИБО ЗА СЛЕДСТВИЕ.</p><p><button onclick="exitMeeting()">ВЕРНУТЬСЯ К ТЕРМИНАЛУ</button></p></div>';
  }
  h+='</div>';
  return h;
}
function meetNext(){S.fin=(S.fin===0?1:S.fin===2?3:S.fin);S.f1msg=null;save();renderApp()}
function final1(i){if(i===DATA.FINAL1.correct){S.fin=2;S.f1msg=null;S.envSeen=true}else{S.f1msg='Нет. Подумайте: кто держал повторный опыт и видел помощника своими глазами?'}save();renderApp()}
function chooseCulprit(n){
  if(n==='Лапин Витя'){S.fin=4;S.f2msg=null}
  else{S.f2msg='ВЕРОЯТНОСТЬ НИЗКА. '+DATA.WRONG_HINT}
  save();renderApp();
}
function final3(i){if(i===DATA.FINAL3.correct){S.fin=5;S.f3msg=null}else{S.f3msg='Нет. Вспомните брошюру №17 и опись №23: где реликвия «начиналась»?'}save();renderApp()}
function exitMeeting(){S.meeting=false;S.fin=5;save();renderApp()}
/* ---------- ЗАПУСК ---------- */
load();
if(S.route&&!S.pendingRoute){renderApp()} else {renderApp()}
</script></body></html>
